apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
spec:
  global:
    clusterName: storedog-k8s
    site: datadoghq.eu
    kubelet:
      tlsVerify: false
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
      appSecret:
        secretName: datadog-secret
        keyName: app-key
    tags:
      - "env:configuring-ssi-k8s"
  override:
    nodeAgent:
      image:
        tag: 7.70.0
    clusterAgent:
      image:
        tag: 7.70.0
    logCollection: # Logs
      enabled: true
      containerCollectAll: true
    apm:
      instrumentation:
        enabled: true
        targets:
          - name: "storedog_namespace"
            namespaceSelector:
              matchNames:
                - "storedog"
                - "system"
            ddTraceConfigs:
              - name: DD_APM_INSTRUMENTATION_DEBUG
                value: "true"
              - name: DD_TRACE_DEBUG
                value: "true"
            ddTraceVersions:
              java: "1"
              python: "3.9.4"
              js: "5"
              ruby: "2"
